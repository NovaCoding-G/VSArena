version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # MVP: no semver-major npm bumps (Next 14 / React 18 / Tailwind 3 / etc.). Revisit post-MVP.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pin three to 0.169.x for @react-three/fiber compatibility.
      - dependency-name: "three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

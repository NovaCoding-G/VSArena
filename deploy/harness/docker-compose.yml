# Hosted harness stack: Node match server + Caddy TLS.
# Copy env.example → .env on the VM, set HARNESS_DOMAIN, then: docker compose up -d

services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HARNESS_PORT: "8787"
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      HARNESS_DOMAIN: ${HARNESS_DOMAIN}
    depends_on:
      harness:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
